[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rift-index"
version = "0.1.0"
description = "Semantic search for League of Legends voice-line transcripts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.17.2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python -m app.vercel_build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
